name: Merge workbench validation
on:
    push:
        branches: [validation/merge-workbench]
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: "1.3.5"
            - run: bun install --frozen-lockfile
            - run: bun x playwright install --with-deps chromium
            - name: Native Linux build gates
              run: >-
                  bun run format:check && bun run typecheck && bun run lint:strict &&
                  bun run react-doctor && bun run architecture:check && bun run deps:check:strict &&
                  bun run l10n:validate && bun run l10n:audit && bun run test:coverage && bun run package
    renderer:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Build the committed final baselines in the digest-pinned renderer
              run: >-
                  ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build'
            - name: Regenerate only the four intentionally changed merge screenshots
              run: >-
                  ./tests/e2e/docker/run.sh 'UPDATE_VISUAL_BASELINE=1 bun run test:visual
                  --grep "merge-editor matches the pixel baseline" --update-snapshots'
            - name: Verify the scoped baseline diff
              run: |
                  node -e '
                  const {execFileSync}=require("node:child_process");
                  const fs=require("node:fs");
                  const assert=require("node:assert/strict");
                  const environmentPath="tests/visual/fixtures/baselineEnvironment.json";
                  const committed=execFileSync("git",["show",`HEAD:${environmentPath}`],{encoding:"utf8"});
                  const expectedEnvironment=JSON.parse(committed);
                  const observedEnvironment=JSON.parse(fs.readFileSync(environmentPath,"utf8"));
                  assert.deepStrictEqual({...observedEnvironment,osRelease:expectedEnvironment.osRelease},expectedEnvironment);
                  console.log(JSON.stringify({environmentInputs:"unchanged",observedKernel:observedEnvironment.osRelease,committedKernel:expectedEnvironment.osRelease}));
                  fs.writeFileSync(environmentPath,committed);
                  const paths=execFileSync("git",["diff","--name-only","--","tests/visual"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
                  const expected=/^tests\/visual\/__screenshots__\/pixelBaselines\.spec\.ts\/pixel-baseline-screenshots-merge-editor-matches-the-pixel-baseline-1-(dark|light)-modern-(narrow|wide)\.png$/;
                  if(paths.some(p=>!expected.test(p))) throw new Error("Unexpected visual diff: "+JSON.stringify(paths));
                  const baselineDir="tests/visual/__screenshots__/pixelBaselines.spec.ts";
                  const baselines=fs.readdirSync(baselineDir).map(p=>`${baselineDir}/${p}`).filter(p=>expected.test(p));
                  assert.equal(baselines.length,4);
                  console.log(JSON.stringify({sourceCommit:"3e9f08183d8d4228e6e99925da77f8cbd91ab706",generatedBaselines:baselines,changedBaselines:paths}));
                  '
            - name: Validate merge layout, scrolling and non-pixel oracles before export
              run: >-
                  ./tests/e2e/docker/run.sh 'bun run test:visual
                  tests/visual/mergeWorkbench.spec.ts tests/visual/nonPixelOracles.spec.ts
                  --grep "(right-hand input|workbench|localized merge controls|merge-editor matches)"'
            - name: Export the four scoped merge baselines
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: merge-ui-baselines
                  path: tests/visual/__screenshots__/pixelBaselines.spec.ts/*merge-editor*.png
                  if-no-files-found: error
                  retention-days: 3
            - name: Compare the complete visual matrix without update mode
              run: ./tests/e2e/docker/run.sh 'bun run test:visual'
            - name: Real Linux VS Code full workflows and Diff regression
              if: always()
              run: >-
                  ./tests/e2e/docker/run.sh 'xvfb-run -a bun run test:e2e --output=test-results/e2e &&
                  xvfb-run -a bun run test:e2e:diff-viewer --output=test-results/diff-e2e'
            - name: Installed production package merge smoke
              if: always()
              run: >-
                  ./tests/e2e/docker/run.sh 'bun run package && xvfb-run -a bun run test:package-smoke --output=test-results/package-smoke'
            - name: Export baseline changes and diagnostics
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: merge-renderer-validation
                  path: |
                      tests/visual/fixtures/knownFindings.json
                      tests/visual/fixtures/knownLocaleFindings.json
                      tests/visual/__screenshots__/pixelBaselines.spec.ts/*merge-editor*.png
                      test-results/
                  retention-days: 3
