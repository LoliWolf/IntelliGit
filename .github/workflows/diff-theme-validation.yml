name: Diff theme validation
on:
    push:
        branches: [validation/diff-theme]
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: "1.3.5"
            - run: bun install --frozen-lockfile
            - run: bun x playwright install --with-deps chromium
            - name: Run the native Linux build gates
              run: >-
                  bun run format:check && bun run typecheck && bun run lint:strict &&
                  bun run architecture:check && bun run deps:check:strict &&
                  bun run test:coverage && bun run package
    renderer:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Validate checked-in baselines in the pinned renderer
              run: >-
                  ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile &&
                  bun run build && bun run test:visual'
            - name: Run Diff workflows in real Linux VS Code
              if: always()
              run: ./tests/e2e/docker/run.sh 'xvfb-run -a bun run test:e2e:diff-viewer'
            - name: Export screenshots
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: diff-theme-validation
                  path: test-results/
                  retention-days: 3
